steps:
  - name: "Fetch spdlog header-only library"
    description: "Retrieve build dependencies from external sources."
    plugin:
      name: "fetch"
      target: external/include
      items:
        - git_archive: https://github.com/gabime/spdlog/archive/refs/tags/v1.17.0.tar.gz
          tag: 1.17.0
          strip-components: 1
          files:
            - include/spdlog

