steps:
  - name: "Build Raspberry Pi Pico firmware"
    docker: "intmain/microci_raspberry_pico:latest"
    plugin:
      name: raspberry_pico
      board: pico2 # pico | pico_w | pico2 | pico2_w
      bash: |
        rm -rf build
        cmake -S . -B build
        cmake --build build

  - name: "Pico board Information"
    docker: "intmain/microci_raspberry_pico:latest"
    only: info
    run_as: root
    privileged: true
    volumes:
      - source: /dev/bus/usb
        destination: /dev/bus/usb
        mode: rw
    plugin:
      name: raspberry_pico
      bash: |
        /opt/picotool/picotool info > info.txt

